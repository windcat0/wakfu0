<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>功能列表 · 数学可视化</title>
  <style>
    :root {
      --bg: #f6f3ef;
      --panel-bg: #ffffff;
      --text: #2d2a24;
      --text-light: #6b6358;
      --accent: #c75b39;
      --accent-soft: #f0e3d8;
      --blue: #4b82b6;
      --gold: #c8963f;
      --green: #4f8c63;
      --purple: #8b6b9e;
      --border: #e3dbd0;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 顶部返回 + 标题 */
    header.top {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .back-link {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-light);
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel-bg);
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .top-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    h1 .icon {
      font-size: 1.6rem;
    }

    .badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1rem;
      line-height: 1.6;
    }

    .count-line {
      color: var(--text-light);
      font-size: 0.88rem;
    }

    .count-line strong {
      color: var(--accent);
    }

    /* 功能卡片网格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    .card:hover::after {
      transform: scaleX(1);
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-badge {
      display: inline-block;
      margin-top: 2px;
      font-size: 0.74rem;
      color: var(--text-light);
      font-weight: 500;
    }

    .card-desc {
      color: var(--text-light);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 12px;
      background: #f0ede8;
      color: var(--text-light);
    }

    .card-enter {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      transition: gap var(--transition);
    }

    .card:hover .card-enter {
      gap: 8px;
    }

    /* 空状态 */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-light);
      background: var(--panel-bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    footer.bottom {
      text-align: center;
      color: var(--text-light);
      font-size: 0.82rem;
      padding-top: 8px;
    }

    @media (max-width: 560px) {
      h1 { font-size: 1.5rem; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top">
      <a href="index.html" class="back-link">← 返回首页</a>

      <div class="top-title-row">
        <h1><span class="icon">🧮</span>功能列表</h1>
        <span class="badge">数学可视化</span>
      </div>

      <p class="subtitle">交互式数学与机器学习可视化工具集，帮助直观理解参数学习与函数拟合的过程。</p>
      <p class="count-line">共 <strong id="funcCount">0</strong> 个功能</p>
    </header>

    <!--
      功能列表由 funcs/manifest.js 动态渲染。
      新增功能方式（二选一）：
        A. 在 funcs/manifest.js 追加一条记录（最简单）
        B. 在 funcs/ 放带 <meta name="func-*"> 的 html，然后运行 `node scripts/gen_manifest.js` 自动重写清单
    -->
    <main class="cards-grid" id="cardsGrid">
      <!-- 卡片由脚本渲染 -->
    </main>

    <footer class="bottom">点击任意卡片进入对应功能页面</footer>
  </div>

  <script src="funcs/manifest.js"></script>
  <script>
    // —— 由 funcs/manifest.js 提供的 window.FUNCS 动态渲染功能卡片 ——
    function renderList(list) {
      const grid = document.getElementById('cardsGrid');
      if (!grid) return;
      if (!Array.isArray(list) || list.length === 0) {
        grid.innerHTML = '<div class="empty">暂无功能。请在 funcs/manifest.js 中添加，或运行 node scripts/gen_manifest.js 生成。</div>';
      } else {
        grid.innerHTML = list.map(f => `
          <a class="card" href="${f.href}">
            <div class="card-head">
              <div class="card-icon">${f.icon || '📄'}</div>
              <div>
                <div class="card-title">${f.title || ''}</div>
                <div class="card-badge">${f.badge || ''}</div>
              </div>
            </div>
            <p class="card-desc">${f.desc || ''}</p>
            <div class="card-tags">${(f.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <span class="card-enter">进入功能 →</span>
          </a>
        `).join('');
      }
      const el = document.getElementById('funcCount');
      if (el) el.textContent = Array.isArray(list) ? list.length : 0;
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderList(window.FUNCS || []);
    });
  </script>
</body>
</html>
