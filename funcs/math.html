        /* ============================================================
             全局样式
             ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', '幼圆', 'Yuanti SC', system-ui, sans-serif;
            background: var(--theme-bg-start);
            background: linear-gradient(145deg, var(--theme-bg-start) 0%, var(--theme-bg-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background 0.5s ease;
        }

        /* ============================================================
             主容器
             ============================================================ */
        .game-container {
            width: 100%;
            max-width: 740px;
            background: var(--theme-card-bg);
            backdrop-filter: blur(4px);
            border-radius: 60px 60px 50px 50px;
            box-shadow: var(--theme-card-shadow), 0 8px 24px var(--theme-shadow);
            padding: 18px 24px 32px;
            position: relative;
            transition: all 0.4s ease;
            border: 2px solid var(--theme-card-border);
        }

        /* ============================================================
             主题切换栏
             ============================================================ */
        .theme-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 4px 0 12px 0;
            border-bottom: 2px solid var(--theme-border);
            margin-bottom: 12px;
            flex-wrap: wrap;
            transition: border-color 0.3s ease;
        }
        .theme-bar-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--theme-secondary);
            margin-right: 4px;
            letter-spacing: 1px;
        }
        .theme-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px var(--theme-dot-shadow);
            position: relative;
            flex-shrink: 0;
        }
        .theme-dot:hover {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.7);
        }
        .theme-dot:active {
            transform: scale(0.92);
        }
        .theme-dot.active {
            border-color: #ffffff;
            box-shadow: 0 0 0 3px var(--theme-primary), 0 4px 12px var(--theme-dot-shadow);
            transform: scale(1.08);
        }
        .theme-dot[data-theme="default"] {
            background: linear-gradient(135deg, #fdeff2, #f58b9f);
        }
        .theme-dot[data-theme="green"] {
            background: linear-gradient(135deg, #e8f5e9, #66bb6a);
        }
        .theme-dot[data-theme="blue"] {
            background: linear-gradient(135deg, #e3f2fd, #42a5f5);
        }
        .theme-dot[data-theme="orange"] {
            background: linear-gradient(135deg, #fff3e0, #ffa726);
        }
        .theme-dot[data-theme="purple"] {
            background: linear-gradient(135deg, #f3e5f5, #ab47bc);
        }
        .theme-dot .dot-tip {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            color: var(--theme-secondary);
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            font-weight: 600;
        }
        .theme-dot.active .dot-tip {
            opacity: 1;
        }

        /* ============================================================
             页面切换
             ============================================================ */
        .page {
            display: none;
            animation: fadePage 0.4s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadePage {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

            letter-spacing: 2px;
            margin-bottom: 2px;
            line-height: 1.2;
            transition: color 0.3s ease;

            display: block;
            font-size: 1.0rem;
            color: var(--theme-text-light);
            font-weight: 400;
            letter-spacing: 4px;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        /* ============================================================

        #homePage .settings-card {

            border: 1px solid var(--theme-card-border);
            transition: all 0.3s ease;

        .setting-group {

        .setting-group:last-child {

        }

        .setting-label {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--theme-secondary);
            display: block;
            margin-bottom: 12px;
            padding-left: 8px;
            transition: color 0.3s ease;
        }

        .option-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .option-grid .opt-btn {
            flex: 1 0 auto;
            min-width: 60px;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2.5px solid var(--theme-border);
            background: var(--theme-input-bg);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--theme-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 2px 6px var(--theme-shadow);
            text-align: center;
            letter-spacing: 0.5px;
        }
        .option-grid .opt-btn:hover {
            background: var(--theme-kb-btn-hover);
            border-color: var(--theme-primary-light);
            transform: translateY(-2px);
        }
        .option-grid .opt-btn:active {
            transform: scale(0.96);
        }
        .option-grid .opt-btn.selected {
            background: var(--theme-primary-light);
            border-color: var(--theme-primary);
            color: var(--theme-primary-dark);
            box-shadow: 0 4px 12px var(--theme-shadow-strong);
        }

        .btn-start {
            display: block;
            width: 100%;
            padding: 20px 10px;
            margin-top: 26px;
            border: none;
            border-radius: 80px;
            background: var(--theme-btn-start);
            color: #fff;
            font-size: 2.0rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 10px 28px var(--theme-shadow-strong);
            transition: all 0.2s ease;
            letter-spacing: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .btn-start:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 16px 40px var(--theme-shadow-strong);
        }
        .btn-start:active {
            transform: scale(0.97);
        }

        /* ============================================================
             游戏页
             ============================================================ */
        #gamePage .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .game-progress-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--theme-secondary);
            background: var(--theme-result-item-bg);
            padding: 6px 18px;
            border-radius: 60px;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        .game-stats {
            display: flex;
            gap: 16px;
            font-size: 1.0rem;
            font-weight: 600;
            color: var(--theme-secondary);
            background: var(--theme-result-item-bg);
            padding: 6px 18px;
            border-radius: 60px;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        .game-stats .stat-correct {
            color: var(--theme-correct);
        }
        .game-stats .stat-wrong {
            color: var(--theme-wrong);
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: var(--theme-progress-track);
            border-radius: 60px;
            margin: 8px 0 14px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
            transition: background 0.3s ease;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 60px;
            background: var(--theme-progress);
            transition: width 0.4s ease, background 0.3s ease;
        }

        .question-card {
            background: var(--theme-card-bg);
            backdrop-filter: blur(2px);
            border-radius: 50px;
            padding: 30px 20px 26px;
            text-align: center;
            box-shadow: inset 0 2px 16px rgba(255, 255, 255, 0.5), 0 8px 28px var(--theme-shadow);
            margin: 2px 0 14px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid var(--theme-card-border);
        }
        .question-text {
            font-size: 3.4rem;
            font-weight: 700;
            color: var(--theme-text);
            letter-spacing: 3px;
            line-height: 1.3;
            word-break: break-word;
            transition: color 0.3s ease;
        }
        .question-text .q-mark {
            color: var(--theme-primary);
            transition: color 0.3s ease;
        }

        /* 输入 & 提交 */
        .answer-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 2px 0 6px;
        }
        .answer-area input {
            flex: 2 1 170px;
            padding: 14px 20px;
            border-radius: 60px;
            border: 3px solid var(--theme-border);
            background: var(--theme-input-bg);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--theme-text);
            text-align: center;
            font-family: inherit;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
            min-width: 110px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .answer-area input:focus {
            border-color: var(--theme-focus);
            box-shadow: 0 0 0 6px var(--theme-shadow-strong);
        }
        .answer-area input:disabled {
            opacity: 0.6;
            border-color: var(--theme-border);
        }
        .answer-area .btn-submit {
            flex: 0 1 auto;
            padding: 14px 30px;
            border: none;
            border-radius: 60px;
            background: var(--theme-btn-submit);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--theme-btn-submit-shadow);
            transition: all 0.2s ease;
            min-width: 110px;
            letter-spacing: 2px;
        }
        .answer-area .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--theme-btn-submit-shadow);
        }
        .answer-area .btn-submit:active:not(:disabled) {
            transform: scale(0.95);
        }
        .answer-area .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 9键数字键盘 ===== */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 360px;
            margin: 12px auto 4px;
            padding: 10px 8px;
            background: var(--theme-kb-bg);
            border-radius: 30px;
            box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.5), 0 4px 16px var(--theme-shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--theme-card-border);
        }
        .numpad-btn {
            padding: 14px 6px;
            border: none;
            border-radius: 20px;
            background: var(--theme-kb-btn);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--theme-kb-text);
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            font-family: inherit;
            line-height: 1;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--theme-border);
        }
        .numpad-btn:hover {
            background: var(--theme-kb-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--theme-shadow);
        }
        .numpad-btn:active {
            transform: scale(0.94);
            background: var(--theme-kb-btn-active);
        }
        .numpad-btn.btn-back {
            font-size: 1.2rem;
            background: var(--theme-kb-btn-hover);
            color: var(--theme-secondary);
        }
        .numpad-btn.btn-clear {
            font-size: 1.0rem;
            background: var(--theme-feedback-wrong-bg);
            color: var(--theme-wrong);
            border-color: var(--theme-wrong);
        }
        .numpad-btn.btn-clear:hover {
            background: #fce4e4;
        }
        .numpad-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .numpad-btn.btn-back:disabled,
        .numpad-btn.btn-clear:disabled {
            opacity: 0.3;
        }

        /* ===== 反馈区 ===== */
        .feedback-area {
            min-height: 56px;
            margin: 6px 0 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 40px;
            padding: 6px 16px;
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 6px;
        }
        .feedback-area.feedback-correct {
            color: var(--theme-correct);
            animation: bounceHappy 0.6s ease;
            background: var(--theme-feedback-correct-bg);
        }
        .feedback-area.feedback-wrong {
            color: var(--theme-wrong);
            animation: shakeSad 0.5s ease;
            background: var(--theme-feedback-wrong-bg);
        }
        .feedback-area .fb-correct-answer {
            color: var(--theme-secondary);
            font-weight: 500;
            margin-left: 8px;
            background: var(--theme-wrong-bg);
            padding: 2px 18px;
            border-radius: 40px;
            font-size: 1.3rem;
        }

        /* ============================================================
             结算页
             ============================================================ */
        #resultPage .result-summary {
            background: var(--theme-card-bg);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            padding: 26px 20px 30px;
            box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.5), 0 8px 24px var(--theme-shadow);
            margin-top: 6px;
            border: 1px solid var(--theme-card-border);
            transition: all 0.3s ease;
        }

        .result-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .result-stat-item {
            background: var(--theme-result-item-bg);
            border-radius: 30px;
            padding: 14px 6px;
            transition: background 0.3s ease;
            border: 1px solid var(--theme-card-border);
        }
        .result-stat-item .stat-number {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--theme-text);
            transition: color 0.3s ease;
        }
        .result-stat-item .stat-label {
            font-size: 0.9rem;
            color: var(--theme-secondary);
            font-weight: 500;
        }
        .result-stat-item.highlight-correct .stat-number {
            color: var(--theme-correct);
        }
        .result-stat-item.highlight-wrong .stat-number {
            color: var(--theme-wrong);
        }
        .result-stat-item.highlight-rate .stat-number {
            color: var(--theme-primary);
        }

        .result-divider {
            border: none;
            height: 2px;
            background: var(--theme-divider);
            margin: 4px 0 16px;
            transition: background 0.3s ease;
        }

        .wrong-list-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--theme-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;

        }
        .wrong-list {
            list-style: none;
            padding: 0;
            max-height: 210px;
            overflow-y: auto;
            border-radius: 30px;

        .wrong-list li {

        .wrong-list .wrong-correct {

        .result-actions {

        .result-actions .btn-result {

            background: var(--theme-btn-retry);
        }
        .btn-home {
            background: var(--theme-btn-home);
        }

        /* ============================================================
             动画
             ============================================================ */
        @keyframes bounceHappy {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            40% {
                transform: scale(1.10);
                opacity: 1;
            }
            70% {
                transform: scale(0.96);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shakeSad {
            0% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-14px);
            }
            40% {
                transform: translateX(14px);
            }
            60% {
                transform: translateX(-10px);
            }
            80% {
                transform: translateX(10px);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* ============================================================
             滚动条美化
             ============================================================ */
        .wrong-list::-webkit-scrollbar {
            width: 6px;
        }
        .wrong-list::-webkit-scrollbar-track {
            background: var(--theme-wrong-bg);
            border-radius: 10px;
        }
        .wrong-list::-webkit-scrollbar-thumb {
            background: var(--theme-scrollbar);
            border-radius: 10px;
        }
        .wrong-list::-webkit-scrollbar-thumb:hover {
            background: var(--theme-scrollbar-hover);
        }

        /* ============================================================
             响应式
             ============================================================ */
        @media (max-width: 550px) {
            .game-container {
                padding: 14px 14px 24px;
                border-radius: 40px;
            }

            }
            .feedback-area {

            }
            .btn-start {
                font-size: 1.5rem;

            .theme-bar {

            }

        @media (max-width: 400px) {

            .main-title {

            }
            .question-text {
                font-size: 2.0rem;
            }
            .option-grid .opt-btn {

            .answer-area .btn-submit {

                min-width: 60px;

            .result-stat-item .stat-number {

            }
            .feedback-area {
                font-size: 1.0rem;

            }
            .numpad {
                max-width: 240px;
                gap: 4px;

            }
            .numpad-btn {

                min-height: 38px;
                padding: 8px 2px;
                border-radius: 12px;
            }
            .theme-dot {
                width: 24px;
                height: 24px;
            }
            .theme-bar {
                gap: 4px;
            }
            .theme-bar-label {
                font-size: 0.65rem;
            }
            .result-actions .btn-result {
                font-size: 0.9rem;
                padding: 12px 6px;
                flex: 1 1 100px;
            }
        }

        /* 辅助类 */
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="game-container" id="app">
        <!-- ============================================================
             主题切换栏 (所有页面共享)
             ============================================================ -->
        <div class="theme-bar" id="themeBar">
            <span class="theme-bar-label">🎨 主题</span>
            <span class="theme-dot" data-theme="default" title="马卡龙粉">
                <span class="dot-tip">粉</span>
            </span>
            <span class="theme-dot active" data-theme="green" title="护眼浅绿">
                <span class="dot-tip">绿</span>
            </span>
            <span class="theme-dot" data-theme="blue" title="星空蓝">
                <span class="dot-tip">蓝</span>
            </span>
            <span class="theme-dot" data-theme="orange" title="暖阳橙">
                <span class="dot-tip">橙</span>
            </span>
            <span class="theme-dot" data-theme="purple" title="梦幻紫">
                <span class="dot-tip">紫</span>
            </span>
        </div>

        <!-- ============================================================
             首页
             ============================================================ -->
        <div class="page active" id="homePage">
            <div class="main-title">
                🧸 数学小勇士
                <small>🌟 加减乘乐园</small>
            </div>

            <div class="settings-card">
                <!-- 运算模式 -->
                <div class="setting-group">
                    <span class="setting-label">🎯 选择模式</span>
                    <div class="option-grid" id="modeGroup">
                        <button class="opt-btn" data-mode="add">➕ 加法</button>
                        <button class="opt-btn" data-mode="sub">➖ 减法</button>
                        <button class="opt-btn" data-mode="mul">✖️ 乘法</button>
                        <button class="opt-btn selected" data-mode="mixed">🌀 混合</button>
                    </div>
                </div>

                <!-- 题量 -->
                <div class="setting-group">
                    <span class="setting-label">📝 题量</span>
                    <div class="option-grid" id="countGroup">
                        <button class="opt-btn" data-count="20">20</button>
                        <button class="opt-btn selected" data-count="30">30</button>
                        <button class="opt-btn" data-count="50">50</button>
                        <button class="opt-btn" data-count="100">100</button>
                    </div>
                </div>

                <!-- 开始 -->
                <button class="btn-start" id="btnStartGame">🚀 开始挑战</button>
            </div>
        </div>

        <!-- ============================================================
             游戏页
             ============================================================ -->
        <div class="page" id="gamePage">
            <!-- 头部信息 -->
            <div class="game-header">
                <span class="game-progress-text" id="progressText">第 1 / 30 题</span>
                <div class="game-stats">
                    <span>✅ <span class="stat-correct" id="correctCount">0</span></span>
                    <span>❌ <span class="stat-wrong" id="wrongCount">0</span></span>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- 题目 -->
            <div class="question-card" id="questionCard">
                <div class="question-text" id="questionText">3 + 5 = <span class="q-mark">?</span></div>
            </div>

            <!-- 输入 & 提交 -->
            <div class="answer-area">
                <input type="text" id="answerInput" inputmode="numeric" autocomplete="off" placeholder="输入答案" />
                <button class="btn-submit" id="btnSubmit">✔ 提交</button>
            </div>

            <!-- 9键数字键盘 -->
            <div class="numpad" id="numpad">
                <button class="numpad-btn" data-value="1">1</button>
                <button class="numpad-btn" data-value="2">2</button>
                <button class="numpad-btn" data-value="3">3</button>
                <button class="numpad-btn" data-value="4">4</button>
                <button class="numpad-btn" data-value="5">5</button>
                <button class="numpad-btn" data-value="6">6</button>
                <button class="numpad-btn" data-value="7">7</button>
                <button class="numpad-btn" data-value="8">8</button>
                <button class="numpad-btn" data-value="9">9</button>
                <button class="numpad-btn btn-back" data-value="back">⌫ 退格</button>
                <button class="numpad-btn" data-value="0">0</button>
                <button class="numpad-btn btn-clear" data-value="clear">✕ 清空</button>
            </div>

            <!-- 反馈 -->
            <div class="feedback-area" id="feedbackArea"></div>
        </div>

        <!-- ============================================================
             结算页
             ============================================================ -->
        <div class="page" id="resultPage">
            <div class="main-title" style="font-size:2.0rem;">
                🏆 挑战完成！
                <small style="font-size:0.8rem;">你真是太棒啦</small>
            </div>

            <div class="result-summary">
                <!-- 统计 -->
                <div class="result-stats">
                    <div class="result-stat-item">
                        <div class="stat-number" id="resultTotal">0</div>
                        <div class="stat-label">📋 总题数</div>
                    </div>
                    <div class="result-stat-item highlight-correct">
                        <div class="stat-number" id="resultCorrect">0</div>
                        <div class="stat-label">✅ 答对</div>
                    </div>
                    <div class="result-stat-item highlight-wrong">
                        <div class="stat-number" id="resultWrong">0</div>
                        <div class="stat-label">❌ 答错</div>
                    </div>
                </div>
                <div class="text-center" style="font-size:1.4rem; font-weight:700; color:var(--theme-secondary); margin-bottom:4px; transition:color 0.3s;">
                    正确率 <span id="resultRate" style="color:var(--theme-primary); font-size:1.9rem; transition:color 0.3s;">0%</span>
                </div>

                <hr class="result-divider" />

                <!-- 错题列表 -->
                <div class="wrong-list-title">📖 错题回顾</div>
                <ul class="wrong-list" id="wrongList">
                    <li class="wrong-list-empty">🎉 全部答对，没有错题！</li>
                </ul>

                <!-- 操作按钮 -->
                <div class="result-actions">
                    <button class="btn-result btn-retry" id="btnRetry">🔄 重新再来</button>
                    <button class="btn-result btn-home" id="btnHome">🏠 返回首页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  JavaScript 逻辑
        // ============================================================

        // -------- 鼓励语 & 温和提示 --------
        const PRAISE_WORDS = [
            '太棒啦！🎉', '真厉害！⭐', '答对咯！✨', '你真棒！🌟',
            '超级聪明！🌈', '太酷啦！🎊', '好厉害呀！💪', '完美！🏅'
        ];
        const GENTLE_HINTS = [
            '再想想哦～', '加油，你可以的！💪', '别灰心，继续努力！',
            '看看正确答案吧～', '下次一定对！🌟', '仔细算一算哟～'
        ];

        // -------- 音效 (Web Audio API，无需外部文件) --------
        let audioCtx = null;
        let soundEnabled = true;
        function getAudioCtx() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    audioCtx = null;
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
        // 播放一个单音
        function playTone(freq, startOffset, duration, type, volume) {
            const ctx = getAudioCtx();
            if (!ctx || !soundEnabled) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            const t0 = ctx.currentTime + startOffset;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(volume, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + duration);
        }
        // 答对：上升三音 C5-E5-G5
        function playCorrectSound() {
            playTone(523.25, 0, 0.14, 'sine', 0.22);
            playTone(659.25, 0.11, 0.14, 'sine', 0.22);
            playTone(783.99, 0.22, 0.26, 'sine', 0.26);
        }
        // 答错：下降两音 A4-F4 (柔和三角波)
        function playWrongSound() {
            playTone(440.00, 0, 0.18, 'triangle', 0.18);
            playTone(349.23, 0.15, 0.32, 'triangle', 0.20);
        }
        // 按键音
        function playClickSound() {
            playTone(880, 0, 0.05, 'sine', 0.10);
        }

        // -------- DOM 引用 --------
        const homePage = document.getElementById('homePage');
        const gamePage = document.getElementById('gamePage');
        const resultPage = document.getElementById('resultPage');

        const modeGroup = document.getElementById('modeGroup');
        const countGroup = document.getElementById('countGroup');
        const btnStart = document.getElementById('btnStartGame');

        const questionText = document.getElementById('questionText');
        const answerInput = document.getElementById('answerInput');
        const btnSubmit = document.getElementById('btnSubmit');
        const feedbackArea = document.getElementById('feedbackArea');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const correctCountEl = document.getElementById('correctCount');
        const wrongCountEl = document.getElementById('wrongCount');

        const resultTotal = document.getElementById('resultTotal');
        const resultCorrect = document.getElementById('resultCorrect');
        const resultWrong = document.getElementById('resultWrong');
        const resultRate = document.getElementById('resultRate');
        const wrongList = document.getElementById('wrongList');
        const btnRetry = document.getElementById('btnRetry');
        const btnHome = document.getElementById('btnHome');

        const numpad = document.getElementById('numpad');
        const themeDots = document.querySelectorAll('.theme-dot');

        // -------- 状态变量 --------
        let selectedMode = 'mixed';
        let selectedCount = 30;
        let currentTheme = 'default';

        let questions = [];
        let currentIndex = 0;
        let correctTotal = 0;
        let wrongTotal = 0;
        let wrongRecords = [];
        let isProcessing = false;

        // -------- 工具：随机整数 --------
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // -------- 生成一道题目 --------
        function generateOneQuestion(mode) {
            let a, b, answer, symbol, display;
            let actualMode = mode;
            if (mode === 'mixed') {
                const ops = ['add', 'sub', 'mul'];
                actualMode = ops[Math.floor(Math.random() * 3)];
            }

            switch (actualMode) {
                case 'add':
                    a = randInt(0, 100);
                    b = randInt(0, 100 - a);
                    answer = a + b;
                    symbol = '+';
                    display = a + ' ' + symbol + ' ' + b;
                    break;
                case 'sub':
                    a = randInt(0, 100);
                    b = randInt(0, a);
                    answer = a - b;
                    symbol = '−';
                    display = a + ' ' + symbol + ' ' + b;
                    break;
                case 'mul':
                    a = randInt(0, 9);
                    b = randInt(0, 9);
                    answer = a * b;
                    symbol = '×';
                    display = a + ' ' + symbol + ' ' + b;
                    break;
                default:
                    a = 1;
                    b = 1;
                    answer = 2;
                    symbol = '+';
                    display = '1 + 1';
            }
            return {
                question: display + ' = ?',
                answer: answer,
                display: display,
                type: actualMode
            };
        }

        // -------- 生成全部题目 --------
        function generateQuestions(mode, count) {
            const qs = [];
            for (let i = 0; i < count; i++) {
                qs.push(generateOneQuestion(mode));
            }
            return qs;
        }

        // -------- 页面切换 --------
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // -------- 重置游戏状态 --------
        function resetGameState() {
            currentIndex = 0;
            correctTotal = 0;
            wrongTotal = 0;
            wrongRecords = [];
            isProcessing = false;
            feedbackArea.textContent = '';
            feedbackArea.className = 'feedback-area';
            answerInput.disabled = false;
            answerInput.value = '';
            answerInput.focus();
            updateStatsDisplay();
            updateProgress();
            enableNumpad(true);
        }

        // -------- 更新统计显示 --------
        function updateStatsDisplay() {
            correctCountEl.textContent = correctTotal;
            wrongCountEl.textContent = wrongTotal;
        }

        // -------- 更新进度 --------
        function updateProgress() {
            const total = questions.length;
            const done = currentIndex;
            progressText.textContent = '第 ' + (done + 1) + ' / ' + total + ' 题';
            const pct = total > 0 ? ((done / total) * 100) : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
        }

        // -------- 启用/禁用数字键盘 --------
        function enableNumpad(enabled) {
            const btns = numpad.querySelectorAll('.numpad-btn');
            btns.forEach(b => b.disabled = !enabled);
        }

        // -------- 显示当前题目 --------
        function showCurrentQuestion() {
            if (!questions.length || currentIndex >= questions.length) {
                showResultPage();
                return;
            }
            const q = questions[currentIndex];
            questionText.innerHTML = q.display + ' = <span class="q-mark">?</span>';
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            feedbackArea.textContent = '';
            feedbackArea.className = 'feedback-area';
            isProcessing = false;
            updateProgress();
            updateStatsDisplay();
            btnSubmit.disabled = false;
            enableNumpad(true);
        }

        // -------- 处理数字键盘点击 --------
        function handleNumpadClick(e) {
            const btn = e.target.closest('.numpad-btn');
            if (!btn) return;
            if (btn.disabled) return;
            const val = btn.dataset.value;

            if (val === 'back') {
                // 退格
                answerInput.value = answerInput.value.slice(0, -1);
            } else if (val === 'clear') {
                // 清空
                answerInput.value = '';
            } else {
                // 数字：追加
                answerInput.value += val;
            }
            // 触发输入事件，以便过滤（但我们的过滤在input事件中）
            answerInput.dispatchEvent(new Event('input', { bubbles: true }));
            answerInput.focus();
        }

        // -------- 提交答案 --------
        function handleSubmit() {
            if (isProcessing) return;
            if (!questions.length || currentIndex >= questions.length) return;

            const raw = answerInput.value.trim();
            if (raw === '') {
                feedbackArea.textContent = '✏️ 输入答案再提交吧～';
                feedbackArea.className = 'feedback-area';
                return;
            }
            const numStr = raw.replace(/[^0-9]/g, '');
            if (numStr === '') {
                feedbackArea.textContent = '🔢 请输入数字哟～';
                feedbackArea.className = 'feedback-area';
                answerInput.value = '';
                return;
            }
            const userAnswer = parseInt(numStr, 10);
            if (isNaN(userAnswer)) {
                feedbackArea.textContent = '🤔 好像不是数字呢～';
                feedbackArea.className = 'feedback-area';
                answerInput.value = '';
                return;
            }

            isProcessing = true;
            answerInput.disabled = true;
            btnSubmit.disabled = true;
            enableNumpad(false);

            const q = questions[currentIndex];
            const isCorrect = (userAnswer === q.answer);

            if (isCorrect) {
                correctTotal++;
                const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
                feedbackArea.textContent = '✅ ' + praise;
                feedbackArea.className = 'feedback-area feedback-correct';
                playCorrectSound();
            } else {
                wrongTotal++;
                wrongRecords.push({
                    question: q.display + ' = ?',
                    correctAnswer: q.answer,
                    userAnswer: userAnswer
                });
                const hint = GENTLE_HINTS[Math.floor(Math.random() * GENTLE_HINTS.length)];
                feedbackArea.innerHTML = '❌ ' + hint + ' &nbsp; 正确答案：<span class="fb-correct-answer">' + q.answer +
                    '</span>';
                feedbackArea.className = 'feedback-area feedback-wrong';
                playWrongSound();
            }

            updateStatsDisplay();

            // 答对快速跳下一题；答错稍长以看清正确答案
            const delay = isCorrect ? 700 : 1300;
            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= questions.length) {
                    showResultPage();
                } else {
                    showCurrentQuestion();
                }
            }, delay);
        }

        // -------- 显示结算页 --------
        function showResultPage() {
            showPage('resultPage');
            const total = questions.length;
            const correct = correctTotal;
            const wrong = wrongTotal;
            const rate = total > 0 ? Math.round((correct / total) * 100) : 0;

            resultTotal.textContent = total;
            resultCorrect.textContent = correct;
            resultWrong.textContent = wrong;
            resultRate.textContent = rate + '%';

            wrongList.innerHTML = '';
            if (wrongRecords.length === 0) {
                wrongList.innerHTML = '<li class="wrong-list-empty">🎉 全部答对，没有错题！</li>';
            } else {
                wrongRecords.forEach(rec => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                            <span class="wrong-q">${rec.question}</span>
                            <span>
                                <span class="wrong-user">${rec.userAnswer}</span>
                                → <span class="wrong-correct">${rec.correctAnswer}</span>
                            </span>
                        `;
                    wrongList.appendChild(li);
                });
            }
            enableNumpad(false);
        }

        // -------- 开始游戏 --------
        function startGame() {
            const modeBtn = modeGroup.querySelector('.opt-btn.selected');
            if (modeBtn) selectedMode = modeBtn.dataset.mode;

            const countBtn = countGroup.querySelector('.opt-btn.selected');
            if (countBtn) selectedCount = parseInt(countBtn.dataset.count, 10);

            questions = generateQuestions(selectedMode, selectedCount);
            if (!questions.length) {
                alert('哎呀，题目生成失败，请重试～');
                return;
            }

            resetGameState();
            showPage('gamePage');
            showCurrentQuestion();
        }

        // -------- 返回首页 --------
        function goHome() {
            showPage('homePage');
            questions = [];
            currentIndex = 0;
            correctTotal = 0;
            wrongTotal = 0;
            wrongRecords = [];
            isProcessing = false;
            feedbackArea.textContent = '';
            feedbackArea.className = 'feedback-area';
            answerInput.disabled = false;
            answerInput.value = '';
            updateStatsDisplay();
            progressFill.style.width = '0%';
            progressText.textContent = '第 0 / 0 题';
            enableNumpad(false);
        }

        // -------- 重新再来 --------
        function retryGame() {
            goHome();
            startGame();
        }

        // ============================================================
        //  主题切换
        // ============================================================
        function setTheme(themeName) {
            // 移除所有主题类
            document.documentElement.classList.remove(
                'theme-green', 'theme-blue', 'theme-orange', 'theme-purple'
            );
            // 默认主题不需要额外类
            if (themeName !== 'default') {
                document.documentElement.classList.add('theme-' + themeName);
            }
            currentTheme = themeName;

            // 更新圆点激活状态
            themeDots.forEach(dot => {
                dot.classList.toggle('active', dot.dataset.theme === themeName);
            });

            // 保存到 localStorage (可选)
            try {
                localStorage.setItem('mathTheme', themeName);
            } catch (_) { /* ignore */ }
        }

        // -------- 初始化主题 --------
        function initTheme() {
            let saved = 'green';
            try {
                const stored = localStorage.getItem('mathTheme');
                if (stored) saved = stored;
            } catch (_) { /* ignore */ }
            // 检查是否有效
            const valid = ['default', 'green', 'blue', 'orange', 'purple'];
            if (!valid.includes(saved)) saved = 'green';
            setTheme(saved);
        }

        // ============================================================
        //  事件绑定
        // ============================================================

        // -------- 模式选择 --------
        modeGroup.addEventListener('click', function(e) {
            const btn = e.target.closest('.opt-btn');
            if (!btn) return;
            modeGroup.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        });

        // -------- 题量选择 --------
        countGroup.addEventListener('click', function(e) {
            const btn = e.target.closest('.opt-btn');
            if (!btn) return;
            countGroup.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        });

        // -------- 开始按钮 --------
        btnStart.addEventListener('click', startGame);

        // -------- 提交按钮 --------
        btnSubmit.addEventListener('click', handleSubmit);

        // -------- 回车提交 --------
        answerInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSubmit();
            }
        });

        // -------- 输入过滤：只允许数字 --------
        answerInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // -------- 数字键盘点击 --------
        numpad.addEventListener('click', handleNumpadClick);

        // -------- 结算按钮 --------
        btnRetry.addEventListener('click', retryGame);
        btnHome.addEventListener('click', goHome);

        // -------- 主题切换 --------
        themeDots.forEach(dot => {
            dot.addEventListener('click', function() {
                const theme = this.dataset.theme;
                setTheme(theme);
            });
        });

        // -------- 点击空白聚焦输入框 --------
        document.addEventListener('click', function(e) {
            const gamePageEl = document.getElementById('gamePage');
            if (gamePageEl.classList.contains('active')) {
                const target = e.target;
                if (!target.closest('input') && !target.closest('button') && !target.closest('.numpad')) {
                    const inp = document.getElementById('answerInput');
                    if (!inp.disabled) {
                        inp.focus();
                    }
                }
            }
        });

        // ============================================================
        //  初始化
        // ============================================================
        (function init() {
            // 主题
            initTheme();

            // 默认选中状态
            const defaultMode = document.querySelector('#modeGroup .opt-btn.selected');
            if (defaultMode) selectedMode = defaultMode.dataset.mode;
            const defaultCount = document.querySelector('#countGroup .opt-btn.selected');
            if (defaultCount) selectedCount = parseInt(defaultCount.dataset.count, 10);

            showPage('homePage');
            enableNumpad(false);

            console.log('🧸 数学小勇士加载完成！ 加油小勇士！🌟');
            console.log('💡 点击主题圆点可切换配色，护眼浅绿已就绪～');
        })();
    </script>

</body>
</html>
